[project]
name = "caratom-backend"
version = "0.1.0"
description = "CARATOM FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.34.0,<0.35",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14.0,<1.15",
    "pydantic>=2.10.0,<2.11",
    "pydantic-settings>=2.7.0,<3",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.28.0",
    "arq>=0.26.0,<0.27",
    "PyJWT[crypto]>=2.10.0,<3",
    "cryptography>=44.0.0,<45",
    "tzdata>=2025.1",
    "reportlab>=4.2.0,<5",
    "PyYAML>=6.0.2,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<8.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0,<0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "I001"]
"alembic/versions/*.py" = ["UP007", "UP035", "E501"]
