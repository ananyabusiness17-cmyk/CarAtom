services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: caratom
      POSTGRES_PASSWORD: caratom_dev
      POSTGRES_DB: caratom
    ports:
      - "5432:5432"
    volumes:
      - caratom_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caratom -d caratom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caratom_pg:
