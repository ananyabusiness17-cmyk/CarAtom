<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CARATOM — Phone UI walkthrough</title>
  <style>
    :root {
      --brand: #5db7e8;
      --brand-2: #176b9e;
      --brand-soft: #eaf6fc;
      --accent-warn: #b56a22;
      --bg: #f7fafc;
      --card: #ffffff;
      --border: #dce8ef;
      --text: #142532;
      --muted: #6a7b86;
      --danger: #c62828;
      --ok: #2e7d4f;
      --page: #161916;
      --shadow: 0 1px 2px rgba(26, 26, 26, 0.04);
      --radius-sm: 10px;
      --radius: 14px;
      --radius-lg: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--page);
      color: #e8ebe9;
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .lede { color: #9aa39c; font-size: 14px; margin: 8px 0 18px; max-width: 56ch; line-height: 1.45; }

    .faces { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .faces button, .chips button {
      font: inherit; cursor: pointer; border: 0; border-radius: 999px;
      padding: 8px 14px; background: #2a2f2c; color: #ddd;
    }
    .faces button.on { background: #e8efe9; color: #111; font-weight: 600; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 14px; }
    .chips button { white-space: nowrap; font-size: 12px; padding: 6px 11px; }
    .chips button.on { background: var(--brand-2); color: #fff; }

    .folders { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .folders button {
      font: inherit; cursor: pointer; border: 1px solid #3a403c;
      border-radius: 10px; padding: 8px 12px; background: #2a2f2c; color: #ddd;
      font-size: 12px; font-weight: 600;
    }
    .folders button.on {
      background: #e8efe9; color: #111; border-color: #c5cdc6;
    }
    .folder-hint {
      font-size: 12px; color: #9aa39c; margin: -6px 0 10px; line-height: 1.4;
    }
    .flow-rail {
      display: flex; align-items: center; gap: 0; margin-bottom: 14px;
      padding: 8px 10px; background: #fff; border: 1px solid var(--border);
      border-radius: var(--radius-sm); overflow-x: auto;
    }
    .flow-dot {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
      background: #ebe8e3; color: var(--muted); font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .flow-dot.on { background: var(--brand); color: #fff; }
    .flow-dot.done { background: var(--brand-soft); color: var(--brand); }
    .flow-line {
      flex: 1; min-width: 8px; height: 2px; background: #e0ddd8; margin: 0 2px;
    }
    .flow-line.done { background: var(--brand-soft); }
    .addon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .addon-tile {
      background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 12px; box-shadow: var(--shadow);
    }
    .addon-tile.sel { border-color: var(--brand); background: #f4faf7; }
    .addon-tile b { font-size: 13px; display: block; }
    .cart-remove { display: block; margin-top: 6px; font-size: 11px; color: var(--accent-warn); font-weight: 600; }
    .li.revised { background: #f4faf7; }
    .strike, .muted.strike { text-decoration: line-through; }

    .stage {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }

    .device {
      width: 375px;
      height: 780px;
      background: #0a0a0a;
      border-radius: 48px;
      padding: 12px;
      box-shadow: 0 0 0 3px #2c2c2c, 0 24px 60px rgba(0,0,0,.5);
      position: relative;
    }
    .device::before {
      content: "";
      position: absolute;
      top: 18px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 34px; background: #000; border-radius: 20px; z-index: 5;
    }
    .screen {
      height: 100%;
      background: var(--bg);
      border-radius: 38px;
      overflow: hidden;
      position: relative;
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    .sb {
      height: 54px;
      padding: 14px 22px 0;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      color: var(--text);
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px 8px; min-height: 44px; flex-shrink: 0;
    }
    .nav h2 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .nav .back, .nav .right {
      font-size: 15px; color: var(--brand); background: none; border: 0; cursor: pointer;
      min-width: 64px; font-weight: 600;
    }
    .nav .right { text-align: right; font-size: 14px; }
    .scroll { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
    .scroll::-webkit-scrollbar { width: 0; }

    .tabbar {
      flex-shrink: 0;
      height: 74px;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: 14px;
      box-shadow: 0 -1px 0 rgba(26,26,26,0.02);
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; font-size: 10px; color: var(--muted); background: none; border: 0; cursor: pointer;
      font-weight: 500;
    }
    .tab.on { color: var(--brand); font-weight: 700; }
    .tab svg { width: 22px; height: 22px; }

    .home-ind {
      position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 5px; background: #111; border-radius: 4px; z-index: 6;
    }

    .large { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; padding: 4px 0 10px; }
    .section-title {
      font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
      margin: 18px 0 10px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; background: var(--brand-soft); color: var(--brand);
      font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
    }
    .chip.warn { background: #fff3eb; color: var(--accent-warn); }
    .chip.ok { background: #e6f4ec; color: var(--ok); }
    .chip.neutral { background: #f0eeea; color: var(--muted); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .cell {
      background: var(--card);
      border-radius: var(--radius-sm);
      padding: 12px;
      border: 1px solid var(--border);
    }
    .cell label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; font-weight: 500; }
    .cell b { font-size: 14px; font-weight: 600; }
    .pkg {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow);
    }
    .pkg.sel {
      border-color: var(--brand);
      background: #f4faf7;
    }
    .pkg .price { color: var(--brand); font-weight: 700; font-size: 15px; margin-top: 6px; }
    .btn {
      width: 100%; border: 0; border-radius: 12px; padding: 14px;
      background: var(--brand); color: #fff; font-weight: 650; font-size: 15px;
      margin-top: 8px; cursor: pointer;
    }
    .btn.sec { background: var(--brand-soft); color: var(--brand); }
    .btn.ghost { background: transparent; color: var(--danger); border: 1px solid #f0d0d0; }
    .list {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .li {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 15px; gap: 10px;
    }
    .li:last-child { border-bottom: 0; }
    .li .chev { color: #c4c0ba; font-weight: 400; }
    .seg {
      display: flex; background: #ebe8e3; border-radius: 10px; padding: 3px; margin-bottom: 14px;
    }
    .seg span {
      flex: 1; text-align: center; font-size: 12px; font-weight: 600; padding: 7px 4px;
      border-radius: 8px; color: var(--muted);
    }
    .seg span.on { background: #fff; color: var(--text); box-shadow: var(--shadow); }
    .map {
      height: 160px; border-radius: var(--radius); margin-bottom: 12px;
      background:
        linear-gradient(90deg, #e4ebe6 1px, transparent 1px) 0 0 / 24px 24px,
        linear-gradient(#e4ebe6 1px, transparent 1px) 0 0 / 24px 24px,
        #eef3ef;
      position: relative; overflow: hidden;
      border: 1px solid var(--border);
    }
    .road {
      position: absolute; height: 10px; background: #c5d0c8; top: 72px; left: 0; right: 0;
    }
    .pin {
      position: absolute; width: 18px; height: 18px; background: var(--brand);
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      left: 58%; top: 48%;
    }
    .van {
      position: absolute; left: 22%; top: 64px; width: 28px; height: 16px;
      background: var(--accent-warn); border-radius: 3px;
    }
    .stars { letter-spacing: 4px; font-size: 28px; color: #d8d4ce; }
    .stars .on { color: var(--accent-warn); }
    .photo {
      height: 88px; border-radius: var(--radius-sm); background: #e4ebe6;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--brand); font-weight: 600;
      border: 1px solid var(--border);
    }
    .banner {
      background: var(--brand); color: #fff; border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 12px; font-size: 14px; line-height: 1.4;
    }
    .explain h2 { font-size: 20px; margin-bottom: 8px; color: #fff; }
    .explain p { color: #b7c0b9; font-size: 14px; line-height: 1.5; }
    .search {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .search.focus {
      border-color: var(--brand);
      color: var(--text);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
      display: inline-block; margin-right: 6px;
    }

    /* Home chrome */
    .home-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 14px;
    }
    .loc-block .loc-label { font-size: 11px; color: var(--muted); font-weight: 500; }
    .loc-block .loc-name {
      font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 4px;
    }
    .loc-block .loc-name::after { content: "▾"; font-size: 11px; color: var(--muted); }
    .vehicle-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1px solid var(--border);
      border-radius: 999px; padding: 8px 12px;
      font-size: 12px; font-weight: 600; box-shadow: var(--shadow);
      max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .vehicle-pill .car-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex-shrink: 0;
    }

    .mode-tabs {
      display: flex; gap: 0; margin: 0 -16px 14px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .mode-tabs span {
      flex: 0 0 auto; padding: 10px 12px 12px; font-size: 13px; font-weight: 600;
      color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
      white-space: nowrap;
    }
    .mode-tabs span.on {
      color: var(--brand); border-bottom-color: var(--brand);
    }
    .mode-tabs span.on.sos-on {
      color: var(--accent-warn); border-bottom-color: var(--accent-warn);
    }

    .flow-steps {
      display: flex; gap: 6px; margin-bottom: 14px; align-items: center;
    }
    .flow-step {
      flex: 1; background: #fff; border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 8px; text-align: center;
      font-size: 11px; font-weight: 600; line-height: 1.3;
      box-shadow: var(--shadow);
    }
    .flow-step b { display: block; font-size: 12px; margin-bottom: 2px; }
    .flow-arrow { color: var(--muted); font-size: 12px; flex-shrink: 0; }

    .oneman-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
    }
    .oneman-card {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px; box-shadow: var(--shadow);
    }
    .oneman-card .ph-icon { margin-bottom: 8px; }
    .oneman-card b { font-size: 13px; display: block; margin-bottom: 2px; }
    .oneman-card .price { color: var(--brand); font-weight: 700; font-size: 14px; margin-top: 6px; }

    .policy-note {
      background: var(--brand-soft); border-radius: 10px; padding: 10px 12px;
      font-size: 12px; color: var(--brand); font-weight: 600; margin-bottom: 14px;
      line-height: 1.4;
    }
    .sos-scroll { background: #faf9f7; }

    .policy-note.warn {
      background: #fff3eb; color: var(--accent-warn);
    }

    .included-list {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow);
    }
    .included-list .li { font-size: 14px; }

    .sos-emergency-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .sos-tile {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 12px; text-align: center; box-shadow: var(--shadow);
    }
    .sos-tile .ph-icon { margin: 0 auto 8px; }
    .sos-tile b { font-size: 12px; font-weight: 600; display: block; }

    .sos-screen .scroll { background: #faf9f7; }
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px; margin-bottom: 4px; box-shadow: var(--shadow);
    }
    .sos-row .sos-btn {
      background: #fff1e6; color: var(--accent-warn); font-weight: 700;
      font-size: 12px; padding: 8px 12px; border-radius: 999px; border: 0;
    }

    /* Brand / model grids */
    .logo-grid, .photo-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 8px;
    }
    .logo-tile, .photo-tile {
      background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius);
      padding: 12px 8px; text-align: center; box-shadow: var(--shadow);
    }
    .logo-tile.sel, .photo-tile.sel {
      border-color: var(--brand); background: #f4faf7;
    }
    .logo-tile b, .photo-tile b {
      display: block; font-size: 12px; font-weight: 600; line-height: 1.25;
    }
    .logo-tile .ph-logo, .photo-tile .ph-car { margin: 0 auto 8px; }
    .check {
      display: inline-flex; width: 18px; height: 18px; border-radius: 50%;
      background: var(--brand); color: #fff; font-size: 11px; align-items: center;
      justify-content: center; margin-top: 6px;
    }

    .tx-chips { display: flex; gap: 8px; margin-bottom: 12px; }
    .tx-chips span {
      flex: 1; text-align: center; padding: 10px; border-radius: 12px;
      border: 1.5px solid var(--border); background: #fff; font-size: 13px; font-weight: 600;
    }
    .tx-chips span.on {
      border-color: var(--brand); background: #f4faf7; color: var(--brand);
    }

    .spec-tile {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: var(--shadow);
    }
    .spec-tile .spec-img {
      height: 64px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #eef3ef;
    }
    .spec-tile .spec-img .ph-icon {
      width: 100%; height: 100%; border: 0; border-radius: 0;
      background: transparent;
    }
    .spec-tile b {
      display: block; padding: 8px 10px 10px; font-size: 12px; font-weight: 600; line-height: 1.3;
    }

    .trust-strip {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-top: 4px;
    }
    .trust-strip .trust-card {
      flex: 0 0 110px; background: #fff; border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 12px; text-align: center;
      box-shadow: var(--shadow);
    }
    .trust-strip .trust-ico {
      width: 48px; height: 48px; margin: 0 auto 8px; border-radius: 10px;
      border: 0; background: transparent;
    }
    .trust-strip b { font-size: 11px; font-weight: 600; display: block; }

    .brand-word {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--brand); text-transform: uppercase; margin-bottom: 2px;
    }

    /* Placeholders — every image / video / logo slot */
    .ph {
      background: #e8ece9;
      border: 1px dashed #c5cdc6;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); overflow: hidden; position: relative; flex-shrink: 0;
    }
    .ph-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; z-index: 1;
    }
    .ph-sm { width: 40px; height: 40px; border-radius: 8px; }
    .ph-md { width: 56px; height: 56px; border-radius: 10px; }
    .ph-lg { height: 72px; border-radius: var(--radius-sm); width: 100%; }
    .ph-xl { height: 140px; border-radius: var(--radius-lg); width: 100%; }
    .ph-wide { height: 100px; border-radius: var(--radius); width: 100%; }
    .ph-avatar { width: 48px; height: 48px; border-radius: 50%; }
    .ph-logo { width: 48px; height: 48px; border-radius: 12px; }
    .ph-icon { width: 36px; height: 36px; border-radius: 10px; }
    .ph-car { height: 56px; border-radius: 8px; width: 100%; }
    .ph-car::before {
      content: "";
      position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      width: 22px; height: 10px; border-radius: 3px 3px 0 0;
      background: var(--brand); opacity: 0.2;
    }
    .ph-car::after {
      content: "";
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      width: 40px; height: 14px; border-radius: 4px 4px 2px 2px;
      background: var(--brand); opacity: 0.28;
    }
    .ph-video { border-radius: var(--radius-lg); }
    .ph-video::after {
      content: "";
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.9); position: absolute;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    }
    .ph-map { border-radius: var(--radius); height: 160px; width: 100%; border: 1px solid var(--border); }
    .ph-part { width: 44px; height: 44px; border-radius: 8px; }
    .ph-pay { width: 40px; height: 40px; border-radius: 10px; }

    .row-ph { display: flex; gap: 12px; align-items: center; }
    .row-ph > div:last-child { flex: 1; min-width: 0; }
    .pkg-row { display: flex; gap: 12px; align-items: flex-start; }
    .pkg-row .ph-md { flex-shrink: 0; }

    .hero {
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 16px;
      height: 140px;
      position: relative;
      color: #fff;
    }
    .hero .ph-video {
      position: absolute; inset: 0; border: 0; border-radius: 0;
      background: linear-gradient(135deg, #dce6df, #b8ccc0);
    }
    .hero-content {
      position: absolute; inset: 0;
      padding: 18px 16px;
      display: flex; flex-direction: column; justify-content: flex-end;
      background: linear-gradient(0deg, rgba(14,61,44,0.75) 0%, rgba(14,61,44,0.15) 55%, transparent 100%);
    }
    .hero .hero-kicker { font-size: 11px; font-weight: 600; opacity: 0.9; margin-bottom: 4px; }
    .hero .hero-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
    .hero-dots {
      display: flex; gap: 5px; margin-top: 10px;
    }
    .hero-dots i {
      width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.35);
      display: block;
    }
    .hero-dots i.on { background: #fff; width: 16px; border-radius: 4px; }

    .tab.sos-tab { color: var(--accent-warn); }
    .tab.sos-tab.on { color: var(--accent-warn); font-weight: 700; }
    .tab.sos-tab svg { stroke: var(--accent-warn); }

    .map-ph-label {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--muted); text-transform: uppercase;
      background: rgba(238,243,239,0.85);
      z-index: 2;
    }
    .map .road, .map .van, .map .pin { z-index: 3; }

    .fuel-preview {

function flowRail(screenId, folderOrKey) {
  const folder = typeof folderOrKey === "string" ? customerFolders[folderOrKey] : folderOrKey;
  if (!folder) return "";
  const screens = folder.screens;
  const idx = screens.findIndex(s => s[0] === screenId);
  if (idx < 0) return "";
  let html = '<div class="flow-rail">';
  screens.forEach((s, i) => {
    const cls = i === idx ? "on" : i < idx ? "done" : "";
    html += `<span class="flow-dot ${cls}">${i + 1}</span>`;
    if (i < screens.length - 1) html += `<span class="flow-line ${i < idx ? "done" : ""}"></span>`;
  });
  return html + "</div>";
}

function techFlowShell(folderKey, screenId, title, body, tab = "today", opts = {}) {
  const folder = techFolders[folderKey];
  const rail = flowRail(screenId, folder);
  return `${sb()}${nav(title, opts.back || "‹", opts.right || "")}<div class="scroll">${rail}${body}</div>${tabs("technician", tab)}`;
}

function flowShell(folderKey, screenId, title, body, tab = "home", opts = {}) {

let face = "customer";
let folder = "general";
let screen = "gs-01-home";

function defaultFolder(faceId) {
  if (faceId === "customer") return "general";
  if (faceId === "technician") return "fieldVisit";
  if (faceId === "admin") return "advisorRevise";
  return Object.keys(apps[faceId].folders)[0];
}

function render() {
  const folders = apps[face].folders;
  if (!folders[folder]) folder = defaultFolder(face);

  document.getElementById("faces").innerHTML = Object.entries(apps).map(([id,a]) =>
    `<button class="${face===id?"on":""}" data-f="${id}">${a.label}</button>`
  ).join("");
  document.querySelectorAll("#faces button").forEach(b => b.onclick = () => {
    face = b.dataset.f;
    folder = defaultFolder(face);
    screen = apps[face].folders[folder].screens[0][0];
    render();
  });

  const foldersEl = document.getElementById("folders");
  const hintEl = document.getElementById("folder-hint");
  foldersEl.style.display = "flex";
  foldersEl.innerHTML = Object.entries(folders).map(([id,f]) =>
    `<button class="${folder===id?"on":""}" data-folder="${id}">${f.label}</button>`
  ).join("");
  document.querySelectorAll("#folders button").forEach(b => b.onclick = () => {
    folder = b.dataset.folder;
    screen = apps[face].folders[folder].screens[0][0];
    render();
  });
  hintEl.textContent = folders[folder].hint;
  hintEl.style.display = "block";
  document.getElementById("chips").innerHTML = folders[folder].screens.map(([id,l]) =>
    `<button class="${screen===id?"on":""}" data-s="${id}">${l}</button>`
  ).join("");

  document.querySelectorAll("#chips button").forEach(b => b.onclick = () => { screen = b.dataset.s; render(); });
  const screenFn = ui[face][screen];
  document.getElementById("screen").innerHTML = screenFn ? screenFn() : `<p class="muted">Screen not found: ${screen}</p>`;
  const c = copy[face][screen] || ["", ""];
  document.getElementById("explain").innerHTML = `<h2>${c[0]}</h2><p>${c[1]}</p>`;
}
render();
